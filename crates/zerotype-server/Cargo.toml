[package]
name = "zerotype-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ZeroType 云后端：JWT 认证 + 配额计费 + ASR/LLM 网关 + WS 流式会话协议。复用 zerotype-core 的纯逻辑。"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bcrypt = "0.16"
futures-util = "0.3"
chrono = "0.4"
hmac = "0.12"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 存储层：sqlx 统一抽象。现在跑 SQLite（零运维），切 Postgres 只需改
# ZEROTYPE_DB_URL（如 postgres://user:pass@host/zerotype）并开启 postgres feature。
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zerotype-core = { path = "../zerotype-core" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
