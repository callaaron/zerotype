[package]
name = "zerotype-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ZeroType 纯逻辑核心：不依赖 Tauri 的可共享模块（会话状态机、热词评分等）。桌面端与未来 axum 后端共用。"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
