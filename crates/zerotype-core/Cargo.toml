[package]
name = "zerotype-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "ZeroType 纯逻辑核心：不依赖 Tauri 的可共享模块（ASR 客户端/润色/录音/状态机/评分/类型）。桌面端与未来 axum 后端共用。"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
cpal = "0.15"
futures-util = "0.3"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
